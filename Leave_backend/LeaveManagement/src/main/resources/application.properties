
# ===============================
# Application
# ===============================
spring.application.name=LeaveManagement
server.port=8080

# ===============================
# Database (MongoDB)
# ===============================
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DATABASE}


# ===============================
# Google Calender API
# ===============================
google.api.key=${GOOGLE_CALENDER_API}
holidays.google.enabled=true
holidays.sync.years=10


# ===============================
# Admin Configuration
# ===============================
admin.emails=${ADMIN_EMAILS}
admin.passwords=${ADMIN_PASSWORDS}
admin.names=${ADMIN_NAMES}

# ===============================
# Mail Configuration (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===============================
# Application Custom Config
# ===============================
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.company-name=DCD



# ===============================
# SMS / Twilio Configuration
# ===============================
sms.enabled=${SMS_ENABLED:true}
twilio.enabled=${TWILIO_ENABLED:true}
twilio.account.sid=${TWILIO_ACCOUNT_SID:AC3e590f04e6489bf2a1240f28ed3964c0}
twilio.auth.token=${TWILIO_AUTH_TOKEN:d3d883ef2aad5eedb6c13b0f889b4f5a}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+12294588014}


sms.api.url=https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID:AC3e590f04e6489bf2a1240f28ed3964c0}/Messages.json
sms.api.key=${TWILIO_AUTH_TOKEN:d3d883ef2aad5eedb6c13b0f889b4f5a}
sms.sender.id=${TWILIO_PHONE_NUMBER:+12294588014}

